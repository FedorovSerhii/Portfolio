<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Sergey Fedorov, system administrator specialising in IT infrastructure, networking and CCTV solutions.">
    <meta name="author" content="Sergey Fedorov">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sergey Fedorov – System Administrator Portfolio">
    <meta property="og:description" content="Portfolio of Sergey Fedorov, system administrator specialising in IT infrastructure, networking and CCTV solutions.">
    <meta property="og:image" content="https://fedorovserhii.github.io/Portfolio/HeaderPicture.png">
    <meta property="og:url" content="https://fedorovserhii.github.io/Portfolio/">
    <meta property="og:locale" content="en_US">
    <meta name="theme-color" content="#2196f3">
    <title>Sergey Fedorov – System Administrator Portfolio</title>
    <link rel="canonical" href="https://fedorovserhii.github.io/Portfolio/">
    <link rel="icon" type="image/png" href="Avatar.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Шапка -->
    <header class="animated-header">
        <img src="HeaderPicture.png" alt="Sergey Fedorov" class="header-photo" width="160" height="148" decoding="async">
        <div class="header-text">Sergey Fedorov – System Administrator</div>
    </header>

    <!-- Селектор языка -->
    <div class="language-selector">
        <label for="language-select">Choose Language:</label>
        <select id="language-select">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="uk">Українська</option>
            <option value="pl">Polski</option>
        </select>
    </div>

    <!-- Основной контейнер -->
    <div class="container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <img src="Avatar.png" alt="Sergey Fedorov" class="profile-photo" width="421" height="448" loading="lazy" decoding="async">
            <nav aria-label="Primary">
                <a href="#experience" class="menu-button" data-section="experience">Work Experience</a>
                <a
                    href="#technologies"
                    id="technologies-link"
                    class="menu-button"
                    data-section="technologies"
                    aria-expanded="false"
                    aria-controls="technologies-menu"
                >Technologies</a>
                <div class="submenu" id="technologies-menu" role="group" aria-labelledby="technologies-link" hidden>
                    <a href="#technologies/familiar" class="submenu-button" data-subsection="familiar">Technologies Familiar With</a>
                    <a href="#technologies/proficient" class="submenu-button" data-subsection="proficient">Technologies I Work With</a>
                </div>
                <a href="#projects" class="menu-button" data-section="projects">Projects</a>
                <a href="#contacts" class="menu-button" data-section="contacts">Contacts</a>
                <a href="#education" class="menu-button" data-section="education">Education</a>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="content" id="main-content" aria-live="polite" aria-labelledby="section-title" tabindex="-1">
            <h1 id="section-title">Welcome!</h1>
            <p>Explore my experience in IT infrastructure, networking, CCTV and VoIP systems.</p>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
